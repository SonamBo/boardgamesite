<!-- title: Contact | BoardGameSite -->
<!-- description: Get in touch with the BoardGameSite team: game ideas, bug reports or questions. -->
<!-- path: /contact -->
<!-- out: contact.html -->
<article class="page">
  <h1>Contact us</h1>
  <p>Game ideas, bug reports, questions: send us a message and we’ll get back to you, usually within a few days. You can also email <a href="mailto:pixelartgames000@gmail.com">pixelartgames000@gmail.com</a>.</p>
  <form class="contact-form card" data-contact novalidate>
    <label>Your name
      <input type="text" name="name" autocomplete="name" maxlength="100" required>
    </label>
    <label>Email
      <input type="email" name="email" autocomplete="email" maxlength="200" required>
    </label>
    <label>Message
      <textarea name="message" maxlength="5000" required></textarea>
    </label>
    <button type="submit" class="btn btn-gold btn-lg">Send message</button>
    <p class="form-msg" role="status"></p>
  </form>
</article>
