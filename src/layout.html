<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://boardgamesite.com{{path}}">
<meta name="theme-color" content="#1D1411">
<script>/* the saved theme, applied before the page paints */try{if(localStorage.getItem('bgs-theme')==='light'){document.documentElement.dataset.theme='light';document.querySelector('meta[name=theme-color]').content='#FFF7EC'}}catch(e){}</script>
<meta name="robots" content="{{robots}}">
<meta property="og:type" content="{{ogtype}}">
<meta property="og:site_name" content="BoardGameSite">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="https://boardgamesite.com{{path}}">
<meta property="og:image" content="{{image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{imagealt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{image}}">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BoardGameSite">
<link rel="preload" href="/assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css">
<script type="module" src="/assets/js/site.js"></script>
{{scripts}}
{{jsonld}}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="layout">
<header class="sidebar">
  <a class="brand" href="/">
    <img src="/assets/img/logo.webp" alt="" width="256" height="256">
    <span>BoardGameSite</span>
  </a>
  <button type="button" class="theme-toggle on-phone" data-theme-toggle aria-label="Switch to light theme" title="Light or dark">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
  </button>
  <button type="button" class="menu-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <nav class="nav" id="site-nav" aria-label="Main">
    <a href="/" {{cur_play}}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
      Play
    </a>
    <a href="/daily" {{cur_daily}}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
      Daily challenge
    </a>
    <a href="/learn" {{cur_learn}}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
      Learn
    </a>
    <a href="/dashboard" {{cur_dashboard}}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      My progress
    </a>
    <a href="/#leaderboards">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V12M10 20V6M16 20v-9M22 20H2"/></svg>
      Leaderboards
    </a>
    <a href="https://www.youtube.com/@Pixel-Art-Games-000" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>
      Watch
    </a>
    <a href="/about" {{cur_about}}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
      About
    </a>
    <div class="nav-divider"></div>
    <button type="button" class="btn btn-gold" data-open-accounts="sidebar-signup">Sign up</button>
    <button type="button" class="btn btn-outline" data-open-accounts="sidebar-login" style="margin-top: 6px">Log in</button>
    <button type="button" class="btn btn-outline" id="install-app" hidden style="margin-top: 6px">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      Install app
    </button>
  </nav>
</header>

<main class="content" id="main">
  <button type="button" class="theme-toggle on-desktop" data-theme-toggle aria-label="Switch to light theme" title="Light or dark">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
  </button>
<div class="container">
{{body}}

<footer class="footer">
  <div class="footer-brand">
    <img src="/assets/img/logo.webp" alt="" width="256" height="256">
    <div><b>BoardGameSite</b><span>© <span data-year>2026</span> Pixel Art Games</span></div>
  </div>
  <nav class="footer-links" aria-label="Footer">
    <a href="/about">About</a>
    <a href="/learn">How to play</a>
    <a href="/contact">Contact</a>
    <a href="/privacy">Privacy Policy</a>
    <a href="/terms">Terms</a>
  </nav>
</footer>
</div>
</main>
</div>
</body>
</html>
