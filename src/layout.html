<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://boardgamesite.com{{path}}">
<meta name="theme-color" content="#161A17">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BoardGameSite">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="https://boardgamesite.com{{path}}">
<meta property="og:image" content="https://boardgamesite.com/assets/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
<script type="module" src="/assets/js/site.js"></script>
{{scripts}}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="layout">
<header class="sidebar">
  <a class="brand" href="/">
    <img src="/assets/img/logo.webp" alt="" width="196" height="196">
    <span>BoardGameSite</span>
  </a>
  <button type="button" class="menu-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <nav class="nav" id="site-nav" aria-label="Main">
    <a href="/" {{cur_play}}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
      Play
    </a>
    <a href="/play/four-in-a-row?mode=daily" {{cur_daily}}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
      Daily challenge
    </a>
    <a href="/#leaderboards">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V12M10 20V6M16 20v-9M22 20H2"/></svg>
      Leaderboards
    </a>
    <a href="https://www.youtube.com/@Pixel-Art-Games-000" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>
      Watch
    </a>
    <a href="/about" {{cur_about}}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
      About
    </a>
    <div class="nav-divider"></div>
    <button type="button" class="btn btn-gold" data-open-accounts="sidebar-signup">Sign up</button>
    <button type="button" class="btn btn-outline" data-open-accounts="sidebar-login" style="margin-top: 6px">Log in</button>
  </nav>
</header>

<main class="content" id="main">
<div class="container">
{{body}}

<footer class="footer">
  <div class="footer-brand">
    <img src="/assets/img/logo.webp" alt="" width="196" height="196">
    <div><b>BoardGameSite</b><span>© <span data-year>2026</span> Pixel Art Games</span></div>
  </div>
  <nav class="footer-links" aria-label="Footer">
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
    <a href="/privacy">Privacy Policy</a>
    <a href="/terms">Terms</a>
  </nav>
</footer>
</div>
</main>
</div>
</body>
</html>
