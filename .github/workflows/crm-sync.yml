name: Sync players to Brevo (reminder emails)

# Once a day in the early evening India time, so "your streak ends tonight" emails arrive while there's
# still time to play. See docs/CRM.md for the setup (Brevo list, API key, secrets).
on:
  schedule:
    - cron: '17 12 * * *'   # 12:17 UTC = 17:47 IST
  workflow_dispatch:
    inputs:
      dry:
        description: 'Only count players, change nothing in Brevo'
        type: boolean
        default: false

concurrency:
  group: crm-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Firebase admin library
        run: npm install --no-save --no-audit --no-fund firebase-admin@13
      - name: Sync opted-in players
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID || secrets.BREVO_LIST_ID }}   # either kind works
        run: node tools/crm-sync.mjs ${{ inputs.dry && '--dry' || '' }}
